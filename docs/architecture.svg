<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Evil Sift Workbench Custom MCP Server Architecture</title>
  <desc id="desc">Claude Code or OpenClaw orchestrates triage through a triage_jsonl MCP tool. Deterministic ingest, detection, evidence validation, and sanitization enforce architectural guardrails before reports, findings, audit trails, execution logs, and agent narratives are produced.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#26384f"/>
    </marker>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 31px Arial, sans-serif; fill: #122033; }
      .subtitle { font: 17px Arial, sans-serif; fill: #536477; }
      .box { fill: #ffffff; stroke: #26384f; stroke-width: 2; rx: 10; }
      .agent { fill: #e8f1ff; stroke: #2f69c8; }
      .mcp { fill: #fff5d8; stroke: #9a6b00; }
      .guard { fill: #e8f8ef; stroke: #26734d; }
      .out { fill: #f3eefe; stroke: #6650a4; }
      .label { font: 700 18px Arial, sans-serif; fill: #122033; }
      .small { font: 14px Arial, sans-serif; fill: #34465c; }
      .tiny { font: 12px Arial, sans-serif; fill: #536477; }
      .note { font: 700 15px Arial, sans-serif; fill: #174f36; }
      .arrow { stroke: #26384f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8aa1bd; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text x="54" y="56" class="title">Evil Sift Workbench: Custom MCP Server Pattern</text>
  <text x="54" y="86" class="subtitle">Agent decides what to investigate; deterministic evidence layer enforces what can be claimed.</text>

  <rect x="64" y="130" width="245" height="112" class="box agent"/>
  <text x="90" y="168" class="label">Claude Code / OpenClaw</text>
  <text x="90" y="196" class="small">plans tool calls</text>
  <text x="90" y="216" class="small">inspects validation notes</text>
  <text x="90" y="236" class="small">writes narrative</text>

  <rect x="382" y="130" width="220" height="112" class="box mcp"/>
  <text x="414" y="168" class="label">triage_jsonl</text>
  <text x="414" y="196" class="small">local MCP tool</text>
  <text x="414" y="216" class="small">typed input/output</text>
  <text x="414" y="236" class="small">no live targets</text>

  <rect x="675" y="130" width="220" height="112" class="box"/>
  <text x="707" y="168" class="label">Fake JSONL Evidence</text>
  <text x="707" y="196" class="small">incident</text>
  <text x="707" y="216" class="small">benign control</text>
  <text x="707" y="236" class="small">injection control</text>

  <rect x="970" y="130" width="220" height="112" class="box out"/>
  <text x="1000" y="168" class="label">Agent Outputs</text>
  <text x="1000" y="196" class="small">investigative narrative</text>
  <text x="1000" y="216" class="small">agent execution log</text>
  <text x="1000" y="236" class="small">token/tool trace</text>

  <path d="M309 186 H382" class="arrow"/>
  <path d="M602 186 H675" class="arrow"/>
  <path d="M895 186 H970" class="dash"/>

  <rect x="74" y="332" width="178" height="88" class="box guard"/>
  <text x="98" y="366" class="label">Strict Ingest</text>
  <text x="98" y="394" class="small">bad JSON fails</text>
  <text x="98" y="414" class="small">duplicate IDs fail</text>

  <rect x="302" y="332" width="198" height="88" class="box guard"/>
  <text x="326" y="366" class="label">Chain Detectors</text>
  <text x="326" y="394" class="small">credential access</text>
  <text x="326" y="414" class="small">execution / C2 / lateral</text>

  <rect x="550" y="332" width="198" height="88" class="box guard"/>
  <text x="574" y="366" class="label">Evidence Validator</text>
  <text x="574" y="394" class="small">missing evidence</text>
  <text x="574" y="414" class="small">drops finding</text>

  <rect x="798" y="332" width="198" height="88" class="box guard"/>
  <text x="822" y="366" class="label">Sanitizer</text>
  <text x="822" y="394" class="small">neutralizes fences</text>
  <text x="822" y="414" class="small">and control chars</text>

  <rect x="1046" y="332" width="178" height="88" class="box guard"/>
  <text x="1070" y="366" class="label">Risk Ranking</text>
  <text x="1070" y="394" class="small">score basis</text>
  <text x="1070" y="414" class="small">confidence labels</text>

  <path d="M492 242 V286 H163 V332" class="arrow"/>
  <path d="M252 376 H302" class="arrow"/>
  <path d="M500 376 H550" class="arrow"/>
  <path d="M748 376 H798" class="arrow"/>
  <path d="M996 376 H1046" class="arrow"/>
  <path d="M1135 332 V286 H492 V242" class="dash"/>

  <rect x="88" y="512" width="205" height="76" class="box out"/>
  <text x="116" y="544" class="label">report.md</text>
  <text x="116" y="568" class="small">analyst narrative</text>

  <rect x="325" y="512" width="205" height="76" class="box out"/>
  <text x="353" y="544" class="label">findings.json</text>
  <text x="353" y="568" class="small">validated findings</text>

  <rect x="562" y="512" width="205" height="76" class="box out"/>
  <text x="590" y="544" class="label">audit_trail.json</text>
  <text x="590" y="568" class="small">input hash + evidence</text>

  <rect x="799" y="512" width="205" height="76" class="box out"/>
  <text x="827" y="544" class="label">execution_log.json</text>
  <text x="827" y="568" class="small">tool steps</text>

  <rect x="1036" y="512" width="205" height="76" class="box out"/>
  <text x="1064" y="544" class="label">agent log</text>
  <text x="1064" y="568" class="small">tool calls + tokens</text>

  <path d="M1135 420 V466 H190 V512" class="arrow"/>
  <path d="M1135 466 H427 V512" class="arrow"/>
  <path d="M1135 466 H665 V512" class="arrow"/>
  <path d="M1135 466 H901 V512" class="arrow"/>
  <path d="M1080 242 V512" class="dash"/>

  <rect x="80" y="636" width="1120" height="50" class="box guard"/>
  <text x="108" y="666" class="note">Architectural guardrails:</text>
  <text x="300" y="666" class="small">validator, sanitizer, strict ingest, local fake data.</text>
  <text x="620" y="666" class="note">Prompt guardrails:</text>
  <text x="750" y="666" class="small">scope and self-correction instructions guide the agent but are not the security boundary.</text>
</svg>
